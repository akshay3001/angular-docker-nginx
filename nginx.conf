server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Send unknown paths to index.html, so the Angular router can handle them
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Always check for a new index.html, so new deploys show at once
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
